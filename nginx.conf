# Configuration Nginx pour BaoPixel
# Redirection automatique vers 404.html pour les pages inexistantes
#
# Placer ce fichier dans: /etc/nginx/sites-available/baopixel
# Puis créer un lien: ln -s /etc/nginx/sites-available/baopixel /etc/nginx/sites-enabled/baopixel
# Redémarrer Nginx: sudo systemctl restart nginx

server {
    listen 80;
    listen [::]:80;
    
    # Remplacer par votre domaine
    server_name baopixel.com www.baopixel.com;
    
    # Redirection HTTP vers HTTPS (décommenter si vous avez un certificat SSL)
    # return 301 https://$server_name$request_uri;
    
    root /var/www/baopixel;
    index index.html index.htm;
    
    # Compression gzip
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    
    # Cache control
    expires 31536000s;
    add_header Cache-Control "public, immutable";
    
    # Redirection des pages inexistantes vers 404.html
    error_page 404 /404.html;
    
    # Ne pas logger les erreurs 404
    access_log off;
    
    location ~ /\. {
        deny all;
    }
    
    location ~ ~$ {
        deny all;
    }
    
    # Pour les fichiers statiques (images, CSS, JS)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|otf|eot)$ {
        expires 31536000s;
        add_header Cache-Control "public, immutable";
        add_header Pragma "public";
    }
    
    # Gestion des requêtes
    location / {
        try_files $uri $uri/ /404.html;
    }
}

